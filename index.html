<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1916" media="(prefers-color-scheme: dark)" />
    <link rel="preload" href="./fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin />
    <title>Caderno</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icone.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icone-192.png" />
    <link rel="stylesheet" href="./css/app.css" />
  </head>
  <body>
    <!-- Visível desde o primeiro quadro; some quando uma tela de verdade aparece. -->
    <section id="tela-carregando" class="tela-carregando" aria-label="Abrindo o Caderno">
      <p class="marca">Caderno</p>
    </section>

    <div id="faixa-local" class="aviso-local" hidden>modo local — sem sincronizar</div>

    <section id="tela-login" class="tela-centro" hidden>
      <h1 class="marca">Caderno</h1>
      <form id="form-email" class="entrar" autocomplete="on">
        <label for="email" class="suave">Seu e-mail</label>
        <input
          id="email"
          class="entrada"
          type="email"
          name="email"
          inputmode="email"
          autocomplete="email"
          placeholder="voce@exemplo.com"
          required
        />
        <button id="btn-enviar-codigo" class="botao botao-principal" type="submit">
          Enviar código
        </button>
      </form>
      <form id="form-codigo" class="entrar" autocomplete="on" hidden>
        <p id="codigo-enviado" class="suave texto-login"></p>
        <label for="codigo" class="suave">Código</label>
        <input
          id="codigo"
          class="entrada entrada-codigo"
          type="text"
          inputmode="numeric"
          autocomplete="one-time-code"
          maxlength="10"
          pattern="[0-9]{6,10}"
          placeholder="000000"
          aria-label="Código do e-mail"
        />
        <button id="btn-entrar-codigo" class="botao botao-principal" type="submit">
          Entrar
        </button>
        <div class="login-links">
          <button id="btn-reenviar" class="botao botao-discreto" type="button">
            Reenviar código
          </button>
          <button id="btn-trocar-email" class="botao botao-discreto" type="button">
            Trocar e-mail
          </button>
        </div>
      </form>
      <p id="login-status" class="login-status" role="status" aria-live="polite"></p>
    </section>

    <section id="tela-sem-acesso" class="tela-centro" hidden>
      <h1 class="marca">Caderno</h1>
      <p>Esta conta não tem acesso.</p>
      <p id="email-sem-acesso" class="suave"></p>
      <button id="btn-sair-sem-acesso" class="botao" type="button">Sair</button>
    </section>

    <div id="tela-app" class="caderno" data-caixa="tudo" hidden>
      <header class="cab">
        <div class="cab-linha">
          <p id="data-hoje" class="data-hoje"></p>
          <div class="cab-acoes">
            <button id="btn-busca" class="icone" type="button" aria-label="Buscar"></button>
            <button id="btn-ajustes" class="icone" type="button" aria-label="Ajustes"></button>
          </div>
        </div>
        <nav id="abas" class="abas" aria-label="Caixas"></nav>
        <div class="cab-titulo">
          <h1 id="nome-caixa" class="nome-caixa">Tudo</h1>
          <div id="modos" class="modos" role="tablist" aria-label="O que ver"></div>
        </div>
        <div id="busca-caixa" class="busca" hidden>
          <input
            id="busca"
            type="search"
            placeholder="Buscar nesta caixa"
            aria-label="Buscar tarefas"
            autocomplete="off"
          />
        </div>
      </header>

      <main id="folha" class="folha">
        <div id="lista" class="lista"></div>
        <section id="notas" class="notas" hidden></section>
        <section id="feitas" class="feitas" hidden></section>
      </main>

      <button id="btn-nova" class="btn-nova" type="button" aria-label="Nova tarefa"></button>
    </div>

    <div id="nova-fundo" class="fundo" hidden></div>
    <section id="nova" class="folha-nova" aria-label="Nova tarefa" hidden></section>

    <div id="data-fundo" class="fundo" hidden></div>
    <section id="escolher-data" class="folha-nova folha-data" aria-label="Escolher data" hidden></section>

    <div id="detalhes-fundo" class="fundo" hidden></div>
    <aside id="detalhes" class="painel painel-detalhes" aria-label="Detalhes da tarefa" hidden></aside>

    <div id="menu-fundo" class="fundo" hidden></div>
    <div id="menu" class="menu" role="menu" hidden></div>

    <div id="ajustes-fundo" class="fundo" hidden></div>
    <aside id="ajustes" class="painel painel-ajustes" aria-label="Ajustes" hidden></aside>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden>
      <span id="toast-texto"></span>
      <button id="toast-acao" class="toast-acao" type="button" hidden>Desfazer</button>
    </div>

    <script src="./vendor/supabase.js"></script>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
